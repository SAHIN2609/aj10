name: Windows x64 VST3 Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows-vst3:

    name: Windows x64 VST3
    runs-on: windows-2022

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4


      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      - name: Show Project Files
        shell: cmd
        run: |
          dir
          echo.
          echo Checking CMakeLists:
          if exist CMakeLists.txt (
            echo FOUND CMakeLists.txt
          ) else (
            echo ERROR: CMakeLists.txt missing
            exit /b 1
          )


      - name: Clean Old Build
        shell: cmd
        run: |
          if exist build rmdir /s /q build


      - name: Configure CMake Visual Studio 2022
        shell: cmd
        run: |
          cmake -S . -B build ^
          -G "Visual Studio 17 2022" ^
          -A x64


      - name: Build Release VST3
        shell: cmd
        run: |
          cmake --build build ^
          --config Release ^
          --parallel


      - name: Find VST3
        shell: cmd
        run: |
          dir /s *.vst3


      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: SISHHIN-HZ-MACHINE-Windows-x64-VST3
          path: |
            **/*.vst3
